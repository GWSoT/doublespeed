<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The Chrome Web Store's small promo tile, 440×280. Little text, so it still reads at half size. -->
<style>
  html, body { margin: 0; width: 440px; height: 280px; overflow: hidden; }
  body {
    display: flex; align-items: center; gap: 22px; padding: 0 36px; box-sizing: border-box;
    background: radial-gradient(circle at 20% 15%, #9b5cf6, transparent 60%), linear-gradient(135deg, #7c3aed, #4c1d95);
    color: #fff; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  svg { flex: none; width: 104px; height: 104px; }
  h1 { margin: 0; font-size: 40px; font-weight: 750; letter-spacing: -.02em; line-height: 1; }
  p { margin: 10px 0 0; font-size: 21px; font-weight: 500; opacity: .88; }
</style>
</head>
<body>
  <!-- The icon's mark, from assets/icon.svg, without its square. -->
  <svg viewBox="12 20 72 56">
    <path d="M47 28 L77 48 L47 68 Z" fill="#fff" stroke="#fff" stroke-width="7" stroke-linejoin="round"/>
    <path d="M23 36 H35 M19 48 H35 M23 60 H35" stroke="#fff" stroke-opacity=".75" stroke-width="7" stroke-linecap="round"/>
  </svg>
  <div>
    <h1>Doublespeed</h1>
    <p>Every video at 2×</p>
  </div>
</body>
</html>
