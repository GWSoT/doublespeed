<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
  The store screenshot, 1280×800: a dark browser window around two real captures that
  scripts/render-store-images.mjs fills in. #page is the video page with the extension's own
  speed label, and #popup is the extension's popup for that tab. The tab strip, toolbar and
  badge are drawn here.
-->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; background: #202124; font: 12px/1 system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .tabs { height: 40px; display: flex; align-items: flex-end; padding: 0 8px 0 78px; position: relative; }
  .lights { position: absolute; left: 14px; top: 14px; display: flex; gap: 8px; }
  .lights i { width: 12px; height: 12px; border-radius: 50%; }
  .tab { width: 240px; height: 32px; background: #35363a; border-radius: 8px 8px 0 0; display: flex; align-items: center; gap: 8px; padding: 0 12px; color: #e8eaed; white-space: nowrap; overflow: hidden; }
  .tab i { flex: none; width: 16px; height: 16px; border-radius: 4px; background: linear-gradient(135deg, #f97316, #db2777); }
  .newtab { color: #9aa0a6; font-size: 18px; padding: 0 12px 8px; }
  .toolbar { height: 44px; background: #35363a; display: flex; align-items: center; gap: 4px; padding: 0 8px; border-bottom: 1px solid #45464b; }
  .btn { position: relative; width: 32px; height: 32px; display: grid; place-items: center; flex: none; border-radius: 50%; }
  .btn svg { width: 18px; height: 18px; fill: none; stroke: #c4c7c5; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .btn.ext { background: #45464b; }
  .btn.ext img { width: 16px; height: 16px; display: block; }
  .badge { position: absolute; right: 0; bottom: 3px; background: #7c3aed; color: #fff; font: 700 9px/11px system-ui, -apple-system, sans-serif; padding: 0 3px; border-radius: 3px; }
  .omni { flex: 1; height: 34px; margin: 0 8px; border-radius: 17px; background: #202124; display: flex; align-items: center; gap: 10px; padding: 0 16px; color: #e8eaed; font-size: 14px; }
  .omni svg { width: 14px; height: 14px; fill: none; stroke: #9aa0a6; stroke-width: 2; }
  .omni b { font-weight: 400; }
  .omni span { color: #9aa0a6; }
  .avatar { width: 24px; height: 24px; border-radius: 50%; background: linear-gradient(135deg, #22d3ee, #6366f1); margin: 0 4px; }
  #page { display: block; width: 1280px; height: 716px; }
  #popup { position: absolute; top: 80px; right: 64px; border-radius: 8px; box-shadow: 0 2px 6px rgb(0 0 0 / .4), 0 12px 32px rgb(0 0 0 / .45); }
</style>
</head>
<body>
  <div class="tabs">
    <div class="lights"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
    <div class="tab"><i></i>Sunset over the ridge, a timelapse</div>
    <div class="newtab">+</div>
  </div>
  <div class="toolbar">
    <div class="btn"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></div>
    <div class="btn"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
    <div class="btn"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg></div>
    <div class="omni"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><b>videos.example<span>/watch/sunset-over-the-ridge</span></b></div>
    <div class="btn ext"><img src="../../public/icon/16.png" alt=""><span class="badge" id="badge">2×</span></div>
    <div class="btn"><svg viewBox="0 0 24 24"><path d="M10 4h4v3a2 2 0 1 0 0 4v3h-3a2 2 0 1 1-4 0H4v-4a2 2 0 1 0 0-4V4z"/></svg></div>
    <div class="avatar"></div>
    <div class="btn"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg></div>
  </div>
  <img id="page" alt="">
  <img id="popup" alt="">
</body>
</html>
