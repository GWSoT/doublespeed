<!doctype html>
<meta charset="utf-8" />
<title>late</title>
<script>
  // A video that appears 2 s after load, the way feeds and players insert them.
  addEventListener('load', () => {
    setTimeout(() => {
      const video = document.createElement('video');
      video.id = 'v';
      video.src = '/media/clip.webm';
      video.preload = 'auto';
      video.muted = true;
      document.body.append(video);
    }, 2000);
  });
</script>
