# The local checks on every pull request to main and every push to it: `make lint`, `make test`,
# `make e2e`, then the store zips as an artifact.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: lint, test, e2e, zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: make install
      - run: make lint
      - run: make test
      - run: npx playwright install --with-deps chromium
      - run: make e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          if-no-files-found: ignore
      - run: make zip
      - uses: actions/upload-artifact@v7
        with:
          name: doublespeed-zips
          path: .output/*.zip
          if-no-files-found: error
          include-hidden-files: true
